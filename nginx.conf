# ─── StockEx – Local Dev Nginx Config ────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name stockex.local;

    root /home/saidi/Projects/stockex;
    index index.php index.html;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/stockex_access.log;
    error_log  /var/log/nginx/stockex_error.log;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ── Security – hide dotfiles ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Favicon & robots (avoid 404 noise) ──────────────────────────────────
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # ── Static assets – long cache ───────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Uploaded files ───────────────────────────────────────────────────────
    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Main rewrite rules (mirrors .htaccess) ──────────────────────────────
    location / {
        try_files $uri $uri/ @rewrite;
    }

    # Clean-URL rewrite: /path → /path.php
    location @rewrite {
        rewrite ^/(.+)$ /$1.php last;
    }

    # ── PHP handling ─────────────────────────────────────────────────────────
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Deny direct access to sensitive dirs ─────────────────────────────────
    location ~ ^/(config|database|setup|temp|tcpdf|phpmailer)/ {
        deny all;
        return 404;
    }
}
